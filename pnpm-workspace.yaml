packages:
  - "apps/*"
  - "packages/*"

# --- Penyesuaian default ketat pnpm 11 (semua deps di-update ke latest via ncu) ---
# Relax supply-chain guard untuk paket yang baru rilis (<24j). Pertimbangkan aktifkan
# lagi untuk operasi normal.
minimumReleaseAge: 0
# Jangan jalankan pre-check install tiap `pnpm run` (bikin turbo gagal).
verifyDepsBeforeRun: false
allowBuilds:
  '@heroui/shared-utils': set this to true or false
  '@reown/appkit': true
  bufferutil: true
  esbuild: true
  keccak: true
  utf-8-validate: true
